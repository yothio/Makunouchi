# PostgreSQL (Neon). 接続先は DATABASE_URL で渡す。
# 本番（Cloud Run）は Neon の pooled 接続用 URL を使う。primary の 1 つだけで、
# cache / queue 用の別 DB は持たない（キャッシュはメモリ、Active Job は :async）。
#
#   development / test: DATABASE_URL が無ければローカルの Postgres
#   （ユーザー・ホストは PGUSER / PGHOST などの環境変数で指定できる）
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: <%= ENV["DATABASE_URL"] ? nil : "admin_development" %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  url: <%= ENV["TEST_DATABASE_URL"] %>
  database: <%= ENV["TEST_DATABASE_URL"] ? nil : "admin_test" %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
