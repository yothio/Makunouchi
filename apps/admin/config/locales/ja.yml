# UI は日本語。rails-i18n は入れず、使う分だけ書く。
ja:
  date:
    formats:
      default: "%Y年%m月%d日"
  time:
    formats:
      default: "%Y年%m月%d日 %H:%M"
  errors:
    format: "%{attribute}%{message}"
    messages:
      blank: "を入力してください"
      taken: "は既に使われています"
      invalid: "は正しくありません"
      inclusion: "は一覧にありません"
      confirmation: "が「%{attribute}」と一致しません"
      too_short: "は%{count}文字以上で入力してください"
      too_long: "は%{count}文字以内で入力してください"
      password_too_long: "は長すぎます"
      in: "は%{count}の範囲で入力してください"
      not_a_number: "は数値で入力してください"
      not_an_integer: "は整数で入力してください"
      greater_than_or_equal_to: "は%{count}以上にしてください"
      less_than_or_equal_to: "は%{count}以下にしてください"
  activerecord:
    models:
      user: "ユーザー"
      question: "問題"
      quiz_session: "開催回"
    errors:
      models:
        question:
          attributes:
            correct_index:
              not_a_number: "を選んでください"
              not_an_integer: "を選んでください"
              in: "は A〜D から選んでください"
              greater_than_or_equal_to: "は A〜D から選んでください"
              less_than_or_equal_to: "は A〜D から選んでください"
            image:
              invalid: "は png / jpeg / webp / gif のいずれかにしてください"
              too_long: "は%{count} MB 以下にしてください"
            choice_a: &duplicate_choice
              duplicate_choice: "は他の選択肢と同じ文言です。違う文言にしてください"
            choice_b: *duplicate_choice
            choice_c: *duplicate_choice
            choice_d: *duplicate_choice
        quiz_session:
          attributes:
            base:
              question_count_out_of_range: "問題は%{min}〜%{max}問にしてください（今は%{count}問です）。"
    attributes:
      question:
        title: "質問のタイトル"
        image: "画像"
        choice_a: "選択肢 A"
        choice_b: "選択肢 B"
        choice_c: "選択肢 C"
        choice_d: "選択肢 D"
        correct_index: "正解"
      user:
        email: "メールアドレス"
        password: "パスワード"
        password_confirmation: "パスワード（確認）"
        role: "役割"
      quiz_session:
        title: "開催回名"
        # base のエラーを作るときも Rails は属性名を引く。full_messages には出ない。
        base: "開催回"
  flash:
    questions:
      saved: "問題を保存しました。"
      destroyed: "問題を削除しました。"
    quiz_sessions:
      registered: "開催回を登録しました。"
    organizers:
      created: "主催者「%{email}」を作成しました。"
  sessions:
    invalid_credentials: "メールアドレスまたはパスワードが違います。"
    too_many_attempts: "ログインの試行が多すぎます。しばらく待ってからやり直してください。"
  quiz_session:
    status:
      pending: "live への登録前（登録できていません）"
      ready: "登録済み"
      host_missing: "live が幹事の認証情報に未対応です。live を更新してから新しい開催回を作り直してください"
    registration:
      invalid_payload: "live がペイロードを受理しませんでした。内容を確認してから、もう一度送ってください。"
      invalid_session_id: "開催回 ID の形式が live に通りませんでした。"
      unauthorized: "live への認証に失敗しました。管理者に設定を確認してもらってください。"
      misconfigured: "live への接続設定が不足しています。管理者に設定を確認してもらってください。"
      insecure_image_url: "画像の公開 URL が https ではありません。R2 の公開設定を確認してから、もう一度送ってください。"
      failed: "live への登録に失敗しました。しばらくしてから、もう一度送ってください。"
  direct_uploads:
    unacceptable: "画像（png / jpeg / webp / gif、%{max_mb} MB 以下）だけアップロードできます。"
