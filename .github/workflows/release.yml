name: release

# Draft の GitHub Release を作るだけ。人が画面で公開するとタグが付き、admin-deploy / live-deploy が release: published で動く。
# GITHUB_TOKEN が起こすイベントは workflow_dispatch / repository_dispatch を除き他ワークフローを起動しない。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "対象（app = apps/admin、live = apps/live）"
        required: true
        type: choice
        options:
          - app
          - live

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: main 以外なら止める
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::main 以外のブランチからはリリースしない"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: タグ名を決める
        id: tag
        env:
          TARGET: ${{ inputs.target }}
          TZ: Asia/Tokyo
        run: |
          TAG="${TARGET}-$(date +%Y%m%d-%H%M)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "次のタグ: $TAG"

      - name: 同じ対象の未公開 Draft を消す
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          PREFIX="${TARGET}-"
          DELETED=0
          while IFS= read -r DRAFT_TAG; do
            [ -z "$DRAFT_TAG" ] && continue
            case "$DRAFT_TAG" in
              "${PREFIX}"*)
                echo "古い Draft を消す: $DRAFT_TAG"
                gh release delete "$DRAFT_TAG" --yes --cleanup-tag
                DELETED=1
                ;;
            esac
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.draft) | .tag_name')
          if [ "$DELETED" -eq 0 ]; then
            echo "消す Draft はない"
          fi

      - name: 同名のタグか公開済み Release があれば止める
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::タグ $TAG は既にある"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG は既にある"
            exit 1
          fi

      - name: Draft Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ inputs.target }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          PREFIX="${TARGET}-"
          PREV_TAG="$(git tag -l "${PREFIX}[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]" | sort | tail -n 1)"

          if [ -n "$PREV_TAG" ]; then
            gh release create "$TAG" --draft --generate-notes --notes-start-tag "$PREV_TAG" --title "$TAG" --target "$TARGET_SHA"
          else
            gh release create "$TAG" --draft --generate-notes --title "$TAG" --target "$TARGET_SHA"
          fi
