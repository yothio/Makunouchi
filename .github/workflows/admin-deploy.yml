name: admin-deploy

# release.yml（workflow_call）と手で push した app-YYYYMMDD-HHMM タグ、ロールバック用の workflow_dispatch。
# GITHUB_TOKEN で打ったタグの push は他ワークフローを起こさないので、release 経路と push 経路が二重に動かない。
on:
  push:
    tags:
      - "app-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]"
  workflow_call:
    inputs:
      tag:
        description: "デプロイするタグ（app-YYYYMMDD-HHMM）"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "再デプロイするタグ（app-YYYYMMDD-HHMM）"
        required: true
        type: string


permissions:
  contents: read
  id-token: write

# 同時に 2 つ動かさない。実行中のデプロイは取り消さず、後から来たものを待たせる
concurrency:
  group: admin-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: タグ名を決める
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$REF_NAME"
          fi
          case "$TAG" in
            app-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9])
              ;;
            *)
              echo "::error::タグ $TAG は app-YYYYMMDD-HHMM 形式ではない"
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0

      - name: タグのコミットが main に含まれるか確かめる
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          git fetch origin main
          TAG_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::タグ $TAG のコミットが main に含まれない"
            exit 1
          fi
          echo "sha=$TAG_SHA" >> "$GITHUB_ENV"

      # secrets に登録していない値はログで伏せられない。プロジェクト番号は GCP_PROJECT_NUMBER を参照する
      - name: プロジェクト番号をログで伏せる
        env:
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
        run: |
          if [ -z "$GCP_PROJECT_NUMBER" ]; then
            echo "::error::GCP_PROJECT_NUMBER が未設定"
            exit 1
          fi
          echo "::add-mask::$GCP_PROJECT_NUMBER"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Artifact Registry へ docker を認証
        env:
          REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY_HOST }}
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - name: イメージをビルドして push（タグは git の SHA）
        working-directory: apps/admin
        env:
          IMAGE: ${{ secrets.GCP_ARTIFACT_IMAGE }}
        run: docker build --platform linux/amd64 -t "$IMAGE:$sha" .

      - name: イメージを push
        env:
          IMAGE: ${{ secrets.GCP_ARTIFACT_IMAGE }}
        run: docker push "$IMAGE:$sha"

      # gcloud の出力（サービス URL・リビジョン名など）をログに出さない（--quiet --no-user-output-enabled。エラーは出る）
      - name: migrate Job のイメージを更新
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          IMAGE: ${{ secrets.GCP_ARTIFACT_IMAGE }}
          MIGRATE_JOB: ${{ secrets.GCP_MIGRATE_JOB }}
        run: gcloud run jobs update "$MIGRATE_JOB" --project "$GCP_PROJECT" --region "$GCP_REGION" --image "$IMAGE:$sha" --quiet --no-user-output-enabled

      # 進捗の出力は止まるが、--wait は Job が失敗すると非ゼロの終了コードで終わる。
      - name: migrate Job を実行して完了を待つ
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          MIGRATE_JOB: ${{ secrets.GCP_MIGRATE_JOB }}
        run: gcloud run jobs execute "$MIGRATE_JOB" --project "$GCP_PROJECT" --region "$GCP_REGION" --wait --quiet --no-user-output-enabled

      - name: サービスをデプロイ
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          IMAGE: ${{ secrets.GCP_ARTIFACT_IMAGE }}
          SERVICE: ${{ secrets.GCP_CLOUD_RUN_SERVICE }}
        run: gcloud run deploy "$SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --image "$IMAGE:$sha" --quiet --no-user-output-enabled
