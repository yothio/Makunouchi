name: admin-test

on:
  pull_request:
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-test.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-test.yml"
  workflow_call:
    inputs:
      ref:
        description: "checkout する ref（タグや SHA。空なら呼び出し元の既定）"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # github.workflow は reusable 呼び出しで呼び出し元名になる。ネスト呼び出しでは
  # event_name が workflow_call にならず、admin-lint と group が衝突して並列がキャンセルされる。
  group: admin-test-${{ inputs.ref != '' && format('call-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ inputs.ref == '' }}

jobs:
  rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}


      # system spec は rack_test（ブラウザ不要）なので、ヘッドレスブラウザの準備は要らない。
      # defaults.run.working-directory は uses に効かないので、ここで指定する
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: apps/admin

      - name: テスト用 DB を作る
        run: bin/rails db:create db:schema:load

      - name: RSpec
        run: bundle exec rspec
