name: live-deploy

# GitHub Release の公開（release: published）だけがきっかけ。タグは公開時に作られる。
# 進行中に公開すると全員の WebSocket が切れる。
on:
  release:
    types: [published]

permissions:
  contents: read

# 同時に 2 つ動かさない。実行中のデプロイは取り消さず、後から来たものを待たせる
concurrency:
  group: live-deploy
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matched: ${{ steps.target.outputs.matched }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: 対象のタグか確かめる
        id: target
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "prerelease のためスキップ"
            echo "matched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TAG" in
            live-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9])
              echo "matched=true" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "タグ $TAG は live-YYYYMMDD-HHMM 形式ではないためスキップ"
              echo "matched=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.matched == 'true'
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0

      - name: タグのコミットが main に含まれるか確かめる
        if: steps.target.outputs.matched == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          git fetch origin main
          TAG_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::タグ $TAG のコミットが main に含まれない"
            exit 1
          fi

  deploy:
    needs: prepare
    if: needs.prepare.outputs.matched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter live test
      - run: pnpm --filter live typecheck
      - run: pnpm --filter live lint

      # secrets に登録していない値はログで伏せられない。アカウント ID は CLOUDFLARE_ACCOUNT_ID を参照する
      - name: アカウント ID をログで伏せる
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID が未設定"
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      # wrangler deploy は workers.dev の URL を標準出力に出す。標準出力は捨て、成否は終了コードで判断する。
      # エラーは標準エラー出力に出るので残す。ADMIN_API_SECRET はここでは渡さない（Worker に登録済みの値が保たれる）
      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_LOG: error
        run: pnpm --filter live run deploy > /dev/null
