name: live-deploy

# main への push では動かさない。進行中にデプロイすると全員の WebSocket が切れるため、手動起動だけにする
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "確認のため Worker 名 makunouchi-live を入力（本番の進行中は起動しない）"
        required: true
        type: string

permissions:
  contents: read

# 同時に 2 つ動かさない。実行中のデプロイは取り消さず、後から来たものを待たせる
concurrency:
  group: live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: 起動条件を確認
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "makunouchi-live" ]; then
            echo "::error::確認用の入力が Worker 名と一致しない"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::main 以外のブランチからはデプロイしない"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter live test
      - run: pnpm --filter live typecheck
      - run: pnpm --filter live lint

      # secrets に登録していない値はログで伏せられない。アカウント ID は CLOUDFLARE_ACCOUNT_ID を参照する
      - name: アカウント ID をログで伏せる
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID が未設定"
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      # wrangler deploy は workers.dev の URL を標準出力に出す。標準出力は捨て、成否は終了コードで判断する。
      # エラーは標準エラー出力に出るので残す。ADMIN_API_SECRET はここでは渡さない（Worker に登録済みの値が保たれる）
      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_LOG: error
        run: pnpm --filter live run deploy > /dev/null
