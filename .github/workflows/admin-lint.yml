name: admin-lint

on:
  pull_request:
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-lint.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          # ruby-version を省略すると working-directory の .ruby-version を読む
          working-directory: apps/admin
          bundler-cache: true
      - run: bin/rubocop
